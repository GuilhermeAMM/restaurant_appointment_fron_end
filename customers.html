<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Clientes</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		body {
			background: #f4f6fb;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
		}
		.sidebar {
			min-height: 100vh;
			background: linear-gradient(180deg, #111827 0%, #1f2937 100%);
			color: #e5e7eb;
			padding: 24px 16px;
		}
		.sidebar .brand {
			font-weight: 700;
			font-size: 18px;
			margin-bottom: 32px;
			letter-spacing: 0.5px;
		}
		.sidebar .nav-link {
			color: #d1d5db;
			border-radius: 8px;
			padding: 10px 12px;
			margin-bottom: 8px;
			transition: all 0.2s ease;
		}
		.sidebar .nav-link:hover,
		.sidebar .nav-link.active {
			background: rgba(255, 255, 255, 0.08);
			color: #fff;
		}
		.content-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			margin-bottom: 24px;
		}
		.table-card {
			background: #fff;
			border-radius: 12px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
			padding: 20px;
		}

        .table-responsive {
            max-height: 80vh; /* Altura máxima antes de criar scroll */
            overflow-y: auto;
            overflow-x: hidden;
        }
		.table thead {
			background: #f8fafc;
		}

        .table thead th {
            position: sticky;
            top: 0;
            z-index: 10;
			border-bottom: none;
			color: #4b5563;
			font-weight: 600;
            text-align: center;
		}

		.table tbody tr:hover {
			background: #f9fafb;
		}
        .table tbody tr{
            text-align: center;
        }
		.badge-status {
			padding: 6px 10px;
			border-radius: 999px;
			font-size: 12px;
		}

	</style>
</head>
<body>
	<div class="container-fluid">
		<div class="row">
			<aside class="col-12 col-md-3 col-lg-2 sidebar">
                <div class="brand">Painel</div>
                <nav class="nav flex-column">
                    <a class="nav-link" href="home.html">Agendamentos</a>
					<a class="nav-link" href="customers.html">Meus Clientes</a>
                    <a class="nav-link" href="register_customer.html?method=post">Cadastrar Cliente</a>
                    <a class="nav-link" href="register_user.html?method=patch">Atualizar usuário</a>
                    <a class="nav-link text-danger" href="#" onclick="logout(); return false;">Sair</a>
                </nav>
            </aside>

			<main class="col-12 col-md-9 col-lg-10 p-4">
				<div class="content-header">
					<div>
						<h4 class="mb-1">Clientes Cadastrados</h4>
						<p class="text-muted mb-0">Visualize todos os clientes</p>
					</div>
					<button class="btn btn-primary" onclick="addCustomer()">Adicionar Cliente</button>
				</div>

				<div class="table-card">
					<div class="table-responsive">
						<table class="table align-middle">
							<thead>
								<tr>
									<th>Nome Completo</th>
									<th>Telefone</th>
									<th>Email</th>
									<th>Data de Cadastro</th>
								</tr>
							</thead>
							<tbody>
                                <!-- Insert customers with JS -->
							</tbody>
						</table>
					</div>
				</div>
			</main>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script src="auth.js"></script>
    <script>
        // ==================== AUTENTICAÇÃO ====================
        const accessToken = localStorage.getItem('access_token');
        if (!accessToken) {
            window.location.href = 'login.html';
        }

        // ==================== FORMATAÇÃO ====================
        function formatDateTime(isoString) {
            if (!isoString) return '—';
            
            const date = new Date(isoString);
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            
            return `${day}/${month}/${year} ${hours}:${minutes}`;
        }

        // ==================== RENDERIZAÇÃO ====================
        function renderCustomerRow(customer) {
            
            return `
                <tr>
                    <td>${customer.full_name || '—'}</td>
                    <td>${customer.phone || '—'}</td>
                    <td>${customer.email || '—'}</td>
                    <td>${formatDateTime(customer.created_at)}</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-secondary" onclick="viewCustomer(${customer.id})">
                            Ver Agendamentos
                        </button>
                        <button class="btn btn-sm btn-outline-warning" onclick="updateCustomer(${customer.id})">
                            Atualizar
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="excludeCustomer(${customer.id})">
                            Excluir
                        </button>
                    </td>
                </tr>
            `;
        }

        function renderErrorState(message) {
            return `
                <tr>
                    <td colspan="5" class="text-center text-danger py-4">
                        ${message}
                    </td>
                </tr>
            `;
        }

        function updateTable(htmlContent) {
            const tbody = document.querySelector('table tbody');
            tbody.innerHTML = htmlContent;
        }

        // ==================== AÇÕES ====================
        function viewCustomer(customerId) {
            window.location.href = `home.html?id=${customerId}&`;
        }

        function updateCustomer(customerId) {
            window.location.href = `register_customer.html?id=${customerId}&method=patch`
        }

        function addCustomer() {
            window.location.href = `register_customer.html?method=post`
        }

        async function excludeCustomer(customerId) {
            const confirmed = confirm('Tem certeza que deseja excluir este cliente?');
            if (!confirmed) return;

            try {
                const response = await fetchWithAuth(`http://127.0.0.1:8001/api/customer/${customerId}/`, {
                    method: 'DELETE',
                });

                if (response.ok) {
                    alert('Cliente excluido com sucesso!');
                    loadCustomers();
                } else {
                    alert('Erro ao excluir cliente');
                }
            } catch (error) {
                console.error('Erro ao excluir cliente:', error);
                alert('Erro ao excluir cliente');
            }
        }

        // ==================== CARREGAMENTO ====================
        async function loadCustomers() {
            try {
                const response = await fetchWithAuth('http://127.0.0.1:8001/api/customer/');
                const customers = await response.json();

                if (!customers || customers.length === 0) {
                    updateTable(renderEmptyState('Nenhum cliente cadastrado'));
                    return;
                }

                const rowsHtml = customers.map(renderCustomerRow).join('');
                updateTable(rowsHtml);

            } catch (error) {
                console.error('Erro ao carregar agendamentos:', error);
                updateTable(renderErrorState('Erro ao carregar agendamentos. Tente novamente.'));
            }
        }

        // Inicializar
        loadCustomers();
    </script>
</body>
</html>
