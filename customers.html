<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clientes</title>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <aside class="col-12 col-md-3 col-lg-2 sidebar">
          <div>
            <div class="brand">Painel</div>
            <nav class="nav flex-column">
              <a class="nav-link" href="home.html"
                ><i class="fa-solid fa-address-book"></i>Agendamentos</a
              >
              <a class="nav-link" href="register_customer.html?method=post"
                ><i class="fa-solid fa-address-card"></i>Cadastrar Cliente</a
              >
              <a
                class="nav-link text-danger"
                href="#"
                onclick="
                  logout();
                  return false;
                "
                >Sair</a
              >
            </nav>
          </div>
          <div class="div-logo">
            <span data-component="/head.html"></span>
          </div>
        </aside>

        <main class="col-12 col-md-9 col-lg-10 p-4">
          <div class="content-header">
            <div>
              <h4 class="mb-1">Clientes Cadastrados</h4>
              <p class="text-muted mb-0">Visualize todos os clientes</p>
            </div>
            <button class="btn btn-primary" onclick="addCustomer()">
              Cadastrar Cliente
            </button>
          </div>

          <div class="table-card">
            <div class="table-responsive">
              <table class="table align-middle">
                <thead>
                  <tr>
                    <th>Nome Completo</th>
                    <th>Telefone</th>
                    <th>Email</th>
                    <th>Data de Cadastro</th>
                  </tr>
                </thead>
                <tbody>
                  <!-- Insert customers with JS -->
                </tbody>
              </table>
            </div>
          </div>
        </main>
        <footer class="footer">© 2026. Todos os direitos reservados.</footer>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script>
      // ==================== AUTENTICAÇÃO ====================
      const accessToken = localStorage.getItem("access_token");
      if (!accessToken) {
        window.location.href = "login.html";
      }

      // ==================== FORMATAÇÃO ====================
      function formatDateTime(isoString) {
        if (!isoString) return "—";

        const date = new Date(isoString);
        const day = String(date.getDate()).padStart(2, "0");
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const year = date.getFullYear();
        const hours = String(date.getHours()).padStart(2, "0");
        const minutes = String(date.getMinutes()).padStart(2, "0");

        return `${day}/${month}/${year} ${hours}:${minutes}`;
      }

      // ==================== RENDERIZAÇÃO ====================
      function renderCustomerRow(customer) {
        return `
                <tr>
                    <td>${customer.full_name || "—"}</td>
                    <td>${customer.phone || "—"}</td>
                    <td>${customer.email || "—"}</td>
                    <td>${formatDateTime(customer.created_at)}</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-secondary" onclick="viewCustomer(${customer.id})">
                            Ver Agendamentos
                        </button>
                        <button class="btn btn-sm btn-outline-warning" onclick="updateCustomer(${customer.id})">
                            Atualizar
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="excludeCustomer(${customer.id})">
                            Excluir
                        </button>
                    </td>
                </tr>
            `;
      }

      function renderErrorState(message) {
        return `
                <tr>
                    <td colspan="5" class="text-center text-danger py-4">
                        ${message}
                    </td>
                </tr>
            `;
      }

      function updateTable(htmlContent) {
        const tbody = document.querySelector("table tbody");
        tbody.innerHTML = htmlContent;
      }

      // ==================== AÇÕES ====================
      function viewCustomer(customerId) {
        window.location.href = `home.html?id=${customerId}&`;
      }

      function updateCustomer(customerId) {
        window.location.href = `register_customer.html?id=${customerId}&method=patch`;
      }

      function addCustomer() {
        window.location.href = `register_customer.html?method=post`;
      }

      async function excludeCustomer(customerId) {
        const confirmed = confirm(
          "Tem certeza que deseja excluir este cliente?",
        );
        if (!confirmed) return;

        try {
          const response = await fetchWithAuth(
            `https://testes.globalhost.app.br/api/customer/${customerId}/`,
            {
              method: "DELETE",
            },
          );

          if (response.ok) {
            alert("Cliente excluido com sucesso!");
            loadCustomers();
          } else {
            alert("Erro ao excluir cliente");
          }
        } catch (error) {
          console.error("Erro ao excluir cliente:", error);
          alert("Erro ao excluir cliente");
        }
      }

      // ==================== CARREGAMENTO ====================
      async function loadCustomers() {
        try {
          const response = await fetchWithAuth(
            "https://testes.globalhost.app.br/api/customer/",
          );
          const customers = await response.json();

          if (!customers || customers.length === 0) {
            updateTable(renderEmptyState("Nenhum cliente cadastrado"));
            return;
          }

          const rowsHtml = customers.map(renderCustomerRow).join("");
          updateTable(rowsHtml);
        } catch (error) {
          console.error("Erro ao carregar agendamentos:", error);
          updateTable(
            renderErrorState("Erro ao carregar agendamentos. Tente novamente."),
          );
        }
      }

      // Inicializar
      loadCustomers();
    </script>
    <script src="assets/js/scripts.js"></script>
  </body>
</html>
