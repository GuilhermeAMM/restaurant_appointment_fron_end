<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Agendamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px 0;
        }
        .register-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 50px 40px;
            width: 100%;
            max-width: 600px;
        }
        .register-container h2 {
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
            text-align: center;
        }
        .register-subtitle {
            color: #999;
            text-align: center;
            margin-bottom: 40px;
            font-size: 14px;
        }
        .form-label {
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .form-control {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.1);
            background-color: #fff;
        }
        .form-control::placeholder {
            color: #bbb;
        }
        .btn-register {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            font-size: 15px;
            color: white;
            width: 100%;
            margin-top: 20px;
            transition: all 0.3s ease;
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
            color: white;
        }
        .btn-register:active {
            transform: translateY(0);
        }
        .login-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #f0f0f0;
            color: #666;
            font-size: 14px;
        }
        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
        .input-group-mb {
            margin-bottom: 20px;
        }
        .row-two-cols {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .row-three-cols {
            display: grid;
            grid-template-columns: 0.5fr 0.5fr 0.5fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 576px) {
            .row-two-cols,
            .row-three-cols {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h2>Cadastro de Agendamentoo</h2>
        <p class="register-subtitle">Preencha os dados do agendamento</p>

        <div id="error-message"></div>

        <form>
            <!-- Cadastro do cliente -->
            <div class="input-group-mb">
                <label for="full_name" class="form-label">Nome completo</label>
                <input type="text" class="form-control" id="full_name" name="full_name" placeholder="Nome completo do cliente" required>
            </div>
            <div class="row-two-cols">
                <div>
                    <label for="telefone" class="form-label">Telefone</label>
                    <input type="tel" class="form-control" id="telefone" name="telefone" placeholder="(00) 00000-0000" maxlength="15" required>
                </div>
                <div>
                    <label for="email" class="form-label">email</label>
                    <input type="text" class="form-control" id="email" name="email" placeholder="cliente@email.com.br" required>
                </div>
            </div>

            <!-- Cadastro do agendamento -->
             <div class="row-three-cols">
                <div>
                    <label for="number_people" class="form-label">N° de pessoas</label>
                    <input type="number" class="form-control" id="number_people" name="number_people" placeholder="-" required>
                </div>
                <div>
                    <label for="start_at" class="form-label">Horário</label>
                    <input type="datetime-local" class="form-control" id="start_at" name="start_at" placeholder="start_at" required>
                </div>
                <div>
                    <label for="payment_method" class="form-label">Pagamento</label>
                    <select class="form-control" id="payment_method" name="payment_method" required>
                        <option value="">Selecione</option>
                        <option value="CARD">Cartão de Crédito</option>
                        <option value="PIX">Pix</option>
                    </select>
                </div>
            </div>

            <div class="input-group-mb">
                <label for="observation" class="form-label">Observação</label>
                <textarea name="observation" id="observation" class="form-control" id="exampleFormControlTextarea1" rows="5">

                </textarea>
            </div>

            <button type="submit" class="btn btn-register" id="btn-submit">Realizar Reserva</button>
        </form>
    </div>

    <script src="auth.js"></script>
    <script>
        const btnSubmit = document.getElementById('btn-submit');
        const errorDiv = document.getElementById('error-message');

        // Verificar se usuário está autenticado
        if (!localStorage.getItem('access_token')) {
            window.location.href = 'login.html';
        }

        // Máscara Telefone
        document.getElementById('telefone').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length <= 11) {
                value = value.replace(/^(\d{2})(\d)/, '($1) $2');
                value = value.replace(/(\d{5})(\d)/, '$1-$2');
            }
            e.target.value = value;
        });

        document.querySelector('form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formDataCustomer = {
                full_name: document.getElementById('full_name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value.replace(/\D/g, ''),
            }

            const formDataAppointment = {       
                observation: document.getElementById('observation').value,
                start_at: document.getElementById('start_at').value,
                number_people: document.getElementById('number_people').value,
                payment_method: document.getElementById('payment_method').value,
                id: null
            };

            errorDiv.innerHTML = '';
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<span class="spinner-border"></span>Cadastrando...';


            try{
                const response = await fetchWithAuth('http://127.0.0.1:8001/api/customer/', {
                    method: 'POST',
                    body: JSON.stringify(formDataCustomer)
                });
                const data_customer = await response.json();
                if (response.ok) {
                    formDataAppointment.id = data_customer.id

                    sendDataAppointment()
                }
            }
            catch (error) {
                errorDiv.innerHTML = `
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            Erro na conexão: ${error.message}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    `;
            }

            async function sendDataAppointment() {
                try {
                    const response = await fetchWithAuth('http://127.0.0.1:8001/api/appointment/', {
                        method: 'POST',
                        body: JSON.stringify(formDataAppointment)
                    });

                    const data = await response.json();

                    if (response.ok) {
                        errorDiv.innerHTML = `
                            <div class="alert alert-success alert-dismissible fade show" role="alert">
                                Agendamento cadastrado com sucesso!
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        `;

                        setTimeout(() => {
                            window.location.href = 'home.html';
                        }, 1500);
                    } else {
                        errorDiv.innerHTML = `
                            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                                ${data.detail || 'Erro ao cadastrar agendamento'}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        `;
                    }
                } catch (error) {
                    errorDiv.innerHTML = `
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            Erro na conexão: ${error.message}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    `;
                } finally {
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = 'Cadastrar Agendamento';
                }
            }
        });

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
