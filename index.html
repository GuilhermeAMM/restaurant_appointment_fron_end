<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="assets/css/styles-form.css" />
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="main-container">
      <div class="div-info">
        <div class="info-content">
          <img src="../assets/img/logo.png" width="500px">
            <h1>Reservas<span id="dynamic-word"></span></h1>
              <p id="dynamic-text"></p>
      </div>
      </div>
        <div class="div-login">
          <div class="login-content">
          <div class="login-container">
            <h2>Bem-vindo</h2>
            <p class="login-subtitle">Faça login na sua conta</p>

            <div id="error-message"></div>

            <form id="login-form">
              <div class="input-group-mb">
                <label for="username" class="form-label">Usuário</label>
                <input
                  type="text"
                  class="form-control"
                  id="username"
                  name="username"
                  placeholder="Digite seu usuário"
                  required
                />
              </div>

              <div class="input-group-mb">
                <label for="password" class="form-label">Senha</label>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  name="password"
                  placeholder="Digite sua senha"
                  required
                />
              </div>

              <div class="form-check" style="margin-bottom: 20px">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="remember"
                  name="remember"
                />
                <label
                  class="form-check-label"
                  for="remember"
                  style="color: #666; font-size: 14px"
                >
                  Lembrar-me
                </label>
              </div>

              <button
                type="submit"
                class="btn-primary-register"
                id="btn-submit"
              >
                Entrar
              </button>

              <div class="forgot-password">
                <a href="pages/send_email_reset_password.html">Esqueceu sua senha?</a>
              </div>
            </form>

            <div class="signup-link">
              Não tem uma conta? <a href="pages/register_user.html">Cadastre-se</a>
            </div>
          </div>
          </div>
           <div class="logo-login">
           
            <footer class="footer">© 2026. GlobalHost. Todos os direitos reservados.</footer>
        </div>
        </div>
      </div>
      
    </div>
    <script src="assets/js/login.js"></script>
  </body>
</html>
