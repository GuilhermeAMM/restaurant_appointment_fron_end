<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
  </head>
  <link rel="stylesheet" href="../assets/css/styles-form.css" />
  <body>
    <div class="login-container">
      <h2>Bem-vindo</h2>
      <p class="login-subtitle">Faça login na sua conta</p>

      <div id="error-message"></div>

      <form id="login-form">
        <div class="input-group-mb">
          <label for="username" class="form-label">Usuário</label>
          <input
            type="text"
            class="form-control"
            id="username"
            name="username"
            placeholder="Digite seu usuário"
            required
          />
        </div>

        <div class="input-group-mb">
          <label for="password" class="form-label">Senha</label>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            placeholder="Digite sua senha"
            required
          />
        </div>

        <div class="form-check" style="margin-bottom: 20px">
          <input
            class="form-check-input"
            type="checkbox"
            id="remember"
            name="remember"
          />
          <label
            class="form-check-label"
            for="remember"
            style="color: #666; font-size: 14px"
          >
            Lembrar-me
          </label>
        </div>

        <button type="submit" class="btn-primary-register" id="btn-submit">
          Entrar
        </button>

        <div class="forgot-password">
          <a href="#">Esqueceu sua senha?</a>
        </div>
      </form>

      <div class="signup-link">
        Não tem uma conta? <a href="register_user.html">Cadastre-se</a>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/script-form.js"></script>
    <script src="../assets/js/login.js"></script>
  </body>
</html>
