<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastrar Cliente</title>
    <link rel="stylesheet" href="../assets/css/styles-form.css" />
  </head>
  <body>
    <div class="register-customer-container">
      <h2>Cadastrar Cliente</h2>
      <p class="register-customer-subtitle">Cadastre seus clientes aqui</p>

      <div id="error-message"></div>

      <button class="voltar" onclick="voltar()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="currentColor"
          class="bi bi-arrow-left me-2"
          viewBox="0 0 16 16"
          style="vertical-align: -2px"
        >
          <path
            fill-rule="evenodd"
            d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"
          />
        </svg>
        Voltar
      </button>

      <form id="register-customer-form">
        <div class="input-group-mb">
          <label for="full_name" class="form-label">Nome completo</label>
          <input
            type="text"
            class="form-control"
            id="full_name"
            name="full_name"
            placeholder="Nome Completo"
            required
          />
        </div>

        <div class="input-group-mb">
          <label for="phone" class="form-label">Telefone</label>
          <input
            type="phone"
            class="form-control"
            id="phone"
            name="phone"
            placeholder="(00) 12345-6789"
            required
          />
        </div>

        <div class="input-group-mb">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            placeholder="cliente@exemplo.com"
            required
          />
        </div>

        <button type="submit" class="btn-primary-register" id="btn-submit">
          Cadastrar
        </button>
      </form>
    </div>

    <script src="../assets/js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/script-form.js"></script>
    <script src="../assets/js/register_customer.js"></script>
  </body>
</html>
