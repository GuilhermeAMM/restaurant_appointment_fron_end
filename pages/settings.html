<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuracoes</title>
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="icon" sizes="16x16" href="../assets/img/icon-logo.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <aside class="col-12 col-md-3 col-lg-2 sidebar">
          <div>
            <div class="brand">Painel</div>
            <nav class="nav flex-column">
              <a class="nav-link" href="home.html"
                ><i class="fa-solid fa-address-book"></i>Agendamentos</a
              >
              <a class="nav-link" href="customers.html"
                ><i class="fa-solid fa-users"></i>Clientes</a
              >
              <a
                class="sair nav-link text-danger"
                href="#"
                onclick="
                  logout();
                  return false;
                "
                >Sair</a
              >
            </nav>
          </div>
          <div class="div-logo">
            <img class="logo" src="../assets/img/logo.png" alt="Logo" />
          </div>
        </aside>

        <main class="col-12 col-md-9 col-lg-10 p-4">
          <div class="content-header">
            <div>
              <h4 class="mb-1">
                <i class="fa-solid fa-gear"></i>Configurações
              </h4>
              <p class="text-muted mb-0">Visualize e gerencie configurações</p>
            </div>
          </div>
          <div class="grid-cards">
            <div class="div-container">
              <div class="div-card">
                <div class="div-bloco-infos">
                  <div class="card-body">
                    <h5 class="card-title mb ">
                      <i class="fa-regular fa-credit-card"></i>
                      Informações de pagamento
                    </h5>
                    <div class="div-container">
                      <div class="row">
                        <div class="col-sm">
                          <i class="fa-brands fa-stripe fa-2x"></i>
                          <div class="card-text" id="status-stripe">
                            <!-- Injection JS -->
                          </div>            
                        </div>
                        <div class="col-sm">
                          <h6 class="mb-10">Valor a receber (R$)</h6>
                          <div class="card-text">
                            <p>
                              R$ 153,47
                            </p>
                          </div>            
                        </div>
                      </div>

                    </div>
                    <button class="btn-settings" onclick="connectStripe()">
                      Vincular Stripe
                    </button>
                  </div>
                </div>
                <div class="div-bloco-infos">
                  <div class="card-body">
                    <h5 class="card-title mb">
                      <i class="fa-solid fa-id-card-clip"></i>
                      Informações do Usuário
                    </h5>
                    <div class="div-container">
                      <div class="row">
                        <div class="card-text col-sm" id="name-user">
                          <!-- JS injection -->
                        </div>
                        <div class="card-text col-sm" id="email-user">
                          <!-- JS injection -->
                        </div>           
                      </div>
                      <div class="card-text col-sm" id="username">
                          <!-- JS injection -->
                      </div>   
                    </div>
                    <button class="btn-settings" onclick="updateUser()">
                      Atualizar Usuário
                    </button>
                  </div>
                </div>
              </div>
              
                <div class="div-bloco-infos">
                  <div class="card-body">
                    <h5 class="card-title">
                      <i class="fa-solid fa-building-columns"></i>
                      Informações do estabelecimento
                    </h5>
                    <div class="div-container">
                      <div class="row">
                        <div class="card-text col-sm" id="establishment">
                          <!-- JS injection -->
                        </div>
                        <div class="card-text col-sm" id="adress">
                         <!-- JS injection -->
                        </div>           
                      </div>
                      <div class="row">
                        <div class="card-text col-sm" id="phone">
                          <!-- JS injection -->
                        </div>
                        <div class="card-text col-sm" id="cnpj">
                          <!-- JS injection -->
                        </div>
                      </div>
                    <button class="btn-settings" onclick="updateEstablishments()">
                      Atualizar Estabelecimento
                    </button>
                  </div>
                </div>
              
            </div>
          </div>
        </main>
        <footer class="footer">
          © 2026. GlobalHost. Todos os direitos reservados.
        </footer>
      </div>
    </div>

    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/settings.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
