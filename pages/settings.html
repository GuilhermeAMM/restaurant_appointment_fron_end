<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuracoes</title>
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <aside class="col-12 col-md-3 col-lg-2 sidebar">
          <div>
            <div class="brand">Painel</div>
            <nav class="nav flex-column">
              <a class="nav-link" href="home.html"
                ><i class="fa-solid fa-address-book"></i>Agendamentos</a
              >
              <a class="nav-link" href="customers.html"
                ><i class="fa-solid fa-users"></i>Clientes</a
              >
              <a class="nav-link" href="busness.html?method=post"
                ><i class="fa-solid fa-building"></i>Estabelecimentos</a
              >
              <a
                class="sair nav-link text-danger"
                href="#"
                onclick="
                  logout();
                  return false;
                "
                >Sair</a
              >
            </nav>
          </div>
          <div class="div-logo">
            <img class="logo" src="../assets/img/logo.png" alt="Logo" />
          </div>
        </aside>

        <main class="col-12 col-md-9 col-lg-10 p-4">
          <div class="content-header">
            <div>
              <h4 class="mb-1">
                <i class="fa-solid fa-gear"></i>Configurações
              </h4>
              <p class="text-muted mb-0">Visualize e gerencie configurações</p>
            </div>
          </div>
          <div class="settings-options">
            <div class="div-stripe_register">
              <button class="btn-settings" onclick="connectStripe()">
                Vincular Stripe
              </button>
            </div>
            <div class="div-update_user">
              <button class="btn-settings" onclick="updateUser()">
                Atualizar Usuário
              </button>
            </div>
            <div class="div-update_user">
              <button class="btn-settings" onclick="updateEstablishments()">
                Atualizar Estabelecimento
              </button>
            </div>
          </div>
        </main>
        <footer class="footer">
          © 2026. GlobalHost. Todos os direitos reservados.
        </footer>
      </div>
    </div>

    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/settings.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
