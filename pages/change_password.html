<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperação de Senha</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/styles-form.css" />
  </head>
  <body>
    <div class="login-container">
      <h2>Recuperação de Senha</h2>
      <p class="login-subtitle">Digite sua nova senha e confirme</p>

      <div id="error-message"></div>

      <form id="form-change-password">
        <div class="input-group-mb">
          <label for="password" class="form-label">Nova senha</label>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            placeholder="Digite uma nova senha"
            required
          />
        </div>

        <div class="input-group-mb">
          <label for="password_confirm" class="form-label"
            >Confirmação de senha</label
          >
          <input
            type="password"
            class="form-control"
            id="password_confirm"
            name="password_confirm"
            placeholder="Confirme sua nova senha"
            required
          />
        </div>

        <button type="submit" class="btn-primary-register" id="btn-submit">
          Cadastrar Nova Senha
        </button>
      </form>

      <div class="signup-link">
        © 2026 Globalhost. Todos os direitos reservados.
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/changePassword.js"></script>
  </body>
</html>
