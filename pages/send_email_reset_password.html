<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperação de Senha</title>
    <link rel="stylesheet" href="../assets/css/styles-form.css" />
    <link rel="icon" sizes="16x16" href="assets/img/icon-logo.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="login-container">
      <h2>Recuperação de Senha</h2>
      <p class="login-subtitle">Digite seu email para recuperar sua senha</p>

      <div id="error-message"></div>

      <form id="form-send-email">
        <div class="input-group-mb form-reset-password-send-email">
          <label for="email" class="form-label">Email do Usuario</label>
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            placeholder="usuario@exemplo.com.br"
            required
          />
        </div>

        <button type="submit" class="btn-primary-register" id="btn-submit">
          Recuperar Minha Senha
        </button>
      </form>

      <div class="signup-link">
        © 2026 Globalhost. Todos os direitos reservados.
      </div>
    </div>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/sendEmailResetPassword.js"></script>
</html>
