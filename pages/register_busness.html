<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Estabelecimento</title>
    <link rel="stylesheet" href="../assets/css/styles-form.css" />
    <link rel="icon" sizes="16x16" href="../assets/img/icon-logo.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="register-container">
      <h2>Cadastro de Estabelecimento</h2>
      <p class="register-subtitle">Preencha os dados do seu Estabelecimento</p>

      <div id="error-message"></div>

      <button class="voltar" onclick="voltar()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="currentColor"
          class="bi bi-arrow-left me-2"
          viewBox="0 0 16 16"
          style="vertical-align: -2px"
        >
          <path
            fill-rule="evenodd"
            d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"
          />
        </svg>
        Voltar
      </button>

      <form>
        <div class="input-group-mb">
          <label for="name" class="form-label">Nome do Estabelecimento</label>
          <input
            type="text"
            class="form-control"
            id="name"
            name="name"
            placeholder="Nome do seu Estabelecimento"
            required
          />
        </div>

        <div class="input-group-mb">
          <label for="cnpj" class="form-label">CNPJ</label>
          <input
            type="text"
            class="form-control"
            id="cnpj"
            name="cnpj"
            placeholder="00.000.000/0000-00"
            maxlength="18"
            required
          />
        </div>

        <div class="row-two-cols">
          <div>
            <label for="cep" class="form-label">CEP</label>
            <input
              type="text"
              class="form-control"
              id="cep"
              name="cep"
              placeholder="00000-000"
              maxlength="9"
              required
            />
          </div>
          <div>
            <label for="telefone" class="form-label">Telefone</label>
            <input
              type="tel"
              class="form-control"
              id="telefone"
              name="telefone"
              placeholder="(00) 00000-0000"
              maxlength="15"
              required
            />
          </div>
        </div>

        <div class="input-group-mb">
          <label for="endereco" class="form-label">Endereço</label>
          <input
            type="text"
            class="form-control"
            id="endereco"
            name="endereco"
            placeholder="Rua, Avenida, etc..."
            required
          />
        </div>

        <div class="row-three-cols">
          <div>
            <label for="cidade" class="form-label">Cidade</label>
            <input
              type="text"
              class="form-control"
              id="cidade"
              name="cidade"
              placeholder="Cidade"
              required
            />
          </div>
          <div>
            <label for="numero" class="form-label">Número</label>
            <input
              type="text"
              class="form-control"
              id="numero"
              name="numero"
              placeholder="Nº"
              required
            />
          </div>
        </div>

        <div class="input-group-mb">
          <label for="estado" class="form-label">Estado</label>
          <select class="form-control" id="estado" name="estado" required>
            <option value="">Selecione o estado</option>
            <option value="AC">Acre</option>
            <option value="AL">Alagoas</option>
            <option value="AP">Amapá</option>
            <option value="AM">Amazonas</option>
            <option value="BA">Bahia</option>
            <option value="CE">Ceará</option>
            <option value="DF">Distrito Federal</option>
            <option value="ES">Espírito Santo</option>
            <option value="GO">Goiás</option>
            <option value="MA">Maranhão</option>
            <option value="MT">Mato Grosso</option>
            <option value="MS">Mato Grosso do Sul</option>
            <option value="MG">Minas Gerais</option>
            <option value="PA">Pará</option>
            <option value="PB">Paraíba</option>
            <option value="PR">Paraná</option>
            <option value="PE">Pernambuco</option>
            <option value="PI">Piauí</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="RN">Rio Grande do Norte</option>
            <option value="RS">Rio Grande do Sul</option>
            <option value="RO">Rondônia</option>
            <option value="RR">Roraima</option>
            <option value="SC">Santa Catarina</option>
            <option value="SP">São Paulo</option>
            <option value="SE">Sergipe</option>
            <option value="TO">Tocantins</option>
          </select>
        </div>

        <div class="form-check" style="margin-bottom: 20px">
          <input
            class="form-check-input"
            type="checkbox"
            id="terms"
            name="terms"
            required
          />
          <label
            class="form-check-label"
            for="terms"
            style="color: #666; font-size: 14px"
          >
            Aceito os
            <a href="#" style="color: #667eea; text-decoration: none"
              >Termos de Serviço</a
            >
          </label>
        </div>
        <div class="div-btn-register">
          <button type="submit" class="btn-primary-register" id="btn-submit">
            Cadastrar
          </button>
        </div>
      </form>
    </div>

    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/register_busness.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
