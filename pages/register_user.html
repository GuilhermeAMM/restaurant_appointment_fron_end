<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="../assets/css/styles-form.css" />
    <link rel="icon" sizes="16x16" href="../assets/img/icon-logo.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="register-container">
      <h2>Criar Conta</h2>
      <p class="register-subtitle">Preencha seus dados para se cadastrar</p>

      <div id="error-message"></div>

      <button class="voltar" onclick="voltar()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="currentColor"
          class="bi bi-arrow-left me-2"
          viewBox="0 0 16 16"
          style="vertical-align: -2px"
        >
          <path
            fill-rule="evenodd"
            d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"
          />
        </svg>
        Voltar
      </button>

      <form id="register-form">
        <div class="row-two-cols">
          <div>
            <label for="first_name" class="form-label">Nome</label>
            <input
              type="text"
              class="form-control"
              id="first_name"
              name="first_name"
              placeholder="Seu nome"
              required
            />
          </div>
          <div>
            <label for="last_name" class="form-label">Sobrenome</label>
            <input
              type="text"
              class="form-control"
              id="last_name"
              name="last_name"
              placeholder="Seu sobrenome"
              required
            />
          </div>
        </div>

        <div class="input-group-mb">
          <label for="username" class="form-label">Nome de Usuário</label>
          <input
            type="text"
            class="form-control"
            id="username"
            name="username"
            pattern="[A-Za-z]+"
            title="Use apenas letras!"
            placeholder="Escolha um nome de usuário"
            required
          />
        </div>

        <div class="input-group-mb">
          <label for="email" class="form-label">E-mail</label>
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            placeholder="seu.email@exemplo.com"
            required
          />
        </div>

        <div class="input-group-mb">
          <label for="password" class="form-label">Senha</label>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            placeholder="Crie uma senha forte"
            required
            minlength="8"
          />
        </div>

        <div class="input-group-mb">
          <label for="password_confirm" class="form-label"
            >Confirmar Senha</label
          >
          <input
            type="password"
            class="form-control"
            id="password_confirm"
            name="password_confirm"
            placeholder="Digite a senha novamente"
            required
            minlength="8"
          />
        </div>

        <div class="form-check" style="margin-bottom: 20px">
          <input
            class="form-check-input"
            type="checkbox"
            id="terms"
            name="terms"
            required
          />
          <label
            class="form-check-label"
            for="terms"
            style="color: #666; font-size: 14px"
          >
            Aceito os
            <a href="#" style="color: #667eea; text-decoration: none"
              >Termos de Serviço</a
            >
            e
            <a href="#" style="color: #667eea; text-decoration: none"
              >Política de Privacidade</a
            >
          </label>
        </div>

        <button type="submit" class="btn-primary-register" id="btn-submit">
          Criar Conta
        </button>
      </form>

      <div class="login-link">
        Já tem uma conta? <a href="login.html">Faça login</a>
      </div>
    </div>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/register_user.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
