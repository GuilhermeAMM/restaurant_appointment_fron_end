<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
  </head>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <body>
    <div class="container-fluid">
      <div class="row">
        <aside class="col-12 col-md-3 col-lg-2 sidebar">
          <div>
            <div class="brand">Painel</div>
            <nav class="nav flex-column">
              <a class="nav-link" href="home.html"
                ><i class="fa-solid fa-address-book"></i>Agendamentos</a
              >
              <a class="nav-link" href="customers.html"
                ><i class="fa-solid fa-users"></i>Clientes</a
              >
              <a class="nav-link" href="busness.html?method=post"
                ><i class="fa-solid fa-building"></i>Estabelecimentos</a
              >
              <a class="nav-link" href="settings.html"
                ><i class="fa-solid fa-gear"></i>Configurações</a
              >
              <a
                class="sair nav-link text-danger"
                href="#"
                onclick="
                  logout();
                  return false;
                "
                >Sair</a
              >
            </nav>
          </div>
          <div class="div-logo">
            <span data-component="head.html"></span>
          </div>
        </aside>

        <main class="col-12 col-md-9 col-lg-10 p-4">
          <div class="content-header">
            <div>
              <h4 class="mb-1">Agendamentos</h4>
              <p class="text-muted mb-0">
                Visualize e gerencie os agendamentos
              </p>
            </div>
            <button class="btn-cadastro" onclick="createAppointment()">
              Novo agendamento
            </button>
          </div>

          <div class="table-card">
            <div class="table-responsive">
              <table class="table align-middle">
                <thead>
                  <tr>
                    <th>Cliente</th>
                    <th>N° de pessoas</th>
                    <th>Data</th>
                    <th>Status</th>
                    <th>Ações</th>
                  </tr>
                </thead>
                <tbody>
                  <!-- insert values with JS -->
                </tbody>
              </table>
            </div>
          </div>
        </main>
        <footer class="footer">© 2026. Todos os direitos reservados.</footer>
      </div>
    </div>

    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/scripts.js"></script>
    <script src="../assets/js/home.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
