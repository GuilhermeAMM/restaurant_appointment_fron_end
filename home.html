<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Dashboard</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		body {
			background: #f4f6fb;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
		}
		.sidebar {
			min-height: 100vh;
			background: linear-gradient(180deg, #111827 0%, #1f2937 100%);
			color: #e5e7eb;
			padding: 24px 16px;
		}
		.sidebar .brand {
			font-weight: 700;
			font-size: 18px;
			margin-bottom: 32px;
			letter-spacing: 0.5px;
		}
		.sidebar .nav-link {
			color: #d1d5db;
			border-radius: 8px;
			padding: 10px 12px;
			margin-bottom: 8px;
			transition: all 0.2s ease;
		}
		.sidebar .nav-link:hover,
		.sidebar .nav-link.active {
			background: rgba(255, 255, 255, 0.08);
			color: #fff;
		}
		.content-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			margin-bottom: 24px;
		}
		.table-card {
			background: #fff;
			border-radius: 12px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
			padding: 20px;
		}
		.table thead {
			background: #f8fafc;
		}
		.table thead th {
			border-bottom: none;
			color: #4b5563;
			font-weight: 600;
		}
		.table tbody tr:hover {
			background: #f9fafb;
		}
		.badge-status {
			padding: 6px 10px;
			border-radius: 999px;
			font-size: 12px;
		}
		.badge-confirmed { background: #dcfce7; color: #166534; }
		.badge-pending { background: #fef9c3; color: #854d0e; }
		.badge-cancelled { background: #fee2e2; color: #991b1b; }
	</style>
</head>
<body>
	<div class="container-fluid">
		<div class="row">
			<aside class="col-12 col-md-3 col-lg-2 sidebar">
                <div class="brand">Painel</div>
                <nav class="nav flex-column">
                    <a class="nav-link" href="#">Meus dados</a>
                    <a class="nav-link" href="#">Dados do estabelecimento</a>
                    <a class="nav-link text-danger" href="#" onclick="logout(); return false;">Sair</a>
                </nav>
            </aside>

			<main class="col-12 col-md-9 col-lg-10 p-4">
				<div class="content-header">
					<div>
						<h4 class="mb-1">Agendamentos</h4>
						<p class="text-muted mb-0">Visualize e gerencie os agendamentos</p>
					</div>
					<button class="btn btn-primary">Novo agendamento</button>
				</div>

				<div class="table-card">
					<div class="table-responsive">
						<table class="table align-middle">
							<thead>
								<tr>
									<th>Cliente</th>
									<th>Servico</th>
									<th>Data</th>
									<th>Status</th>
									<th class="text-end">Acoes</th>
								</tr>
							</thead>
							<tbody>
								<tr>
									<td>Maria Souza</td>
									<td>Consulta</td>
									<td>18/01/2026 14:00</td>
									<td><span class="badge-status badge-confirmed">Confirmado</span></td>
									<td class="text-end">
										<button class="btn btn-sm btn-outline-secondary">Ver</button>
										<button class="btn btn-sm btn-outline-danger">Cancelar</button>
									</td>
								</tr>
								<tr>
									<td>Joao Lima</td>
									<td>Avaliacao</td>
									<td>18/01/2026 16:30</td>
									<td><span class="badge-status badge-pending">Pendente</span></td>
									<td class="text-end">
										<button class="btn btn-sm btn-outline-secondary">Ver</button>
										<button class="btn btn-sm btn-outline-danger">Cancelar</button>
									</td>
								</tr>
								<tr>
									<td>Ana Costa</td>
									<td>Retorno</td>
									<td>19/01/2026 10:00</td>
									<td><span class="badge-status badge-cancelled">Cancelado</span></td>
									<td class="text-end">
										<button class="btn btn-sm btn-outline-secondary">Ver</button>
										<button class="btn btn-sm btn-outline-danger">Cancelar</button>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</main>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script src="auth.js"></script>
    <script>
        // ==================== AUTENTICAÇÃO ====================
        const accessToken = localStorage.getItem('access_token');
        if (!accessToken) {
            window.location.href = 'login.html';
        }

        // ==================== FORMATAÇÃO ====================
        function formatDateTime(isoString) {
            if (!isoString) return '—';
            
            const date = new Date(isoString);
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            
            return `${day}/${month}/${year} ${hours}:${minutes}`;
        }

        function getStatusConfig(status) {
            const configs = {
                'confirmed': { class: 'badge-confirmed', text: 'Confirmado' },
                'pending': { class: 'badge-pending', text: 'Pendente' },
                'cancelled': { class: 'badge-cancelled', text: 'Cancelado' }
            };
            
            return configs[status] || { class: 'badge-pending', text: status };
        }

        // ==================== RENDERIZAÇÃO ====================
        function renderAppointmentRow(appointment) {
            const statusConfig = getStatusConfig(appointment.status);
            
            return `
                <tr>
                    <td>${appointment.customer || '—'}</td>
                    <td>${appointment.service || '—'}</td>
                    <td>${formatDateTime(appointment.start_at)}</td>
                    <td>
                        <span class="badge-status ${statusConfig.class}">
                            ${statusConfig.text}
                        </span>
                    </td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-secondary" onclick="viewAppointment(${appointment.id})">
                            Ver
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="cancelAppointment(${appointment.id})">
                            Cancelar
                        </button>
                    </td>
                </tr>
            `;
        }

        function renderEmptyState(message) {
            return `
                <tr>
                    <td colspan="5" class="text-center text-muted py-4">
                        ${message}
                    </td>
                </tr>
            `;
        }

        function renderErrorState(message) {
            return `
                <tr>
                    <td colspan="5" class="text-center text-danger py-4">
                        ${message}
                    </td>
                </tr>
            `;
        }

        function updateTable(htmlContent) {
            const tbody = document.querySelector('table tbody');
            tbody.innerHTML = htmlContent;
        }

        // ==================== AÇÕES ====================
        function viewAppointment(appointmentId) {
            window.location.href = `appointment_detail.html?id=${appointmentId}`;
        }

        async function cancelAppointment(appointmentId) {
            const confirmed = confirm('Tem certeza que deseja cancelar este agendamento?');
            if (!confirmed) return;

            try {
                const response = await fetchWithAuth(`http://127.0.0.1:8001/api/appointment/${appointmentId}/`, {
                    method: 'PATCH',
                    body: JSON.stringify({ status: 'cancelled' })
                });

                if (response.ok) {
                    alert('Agendamento cancelado com sucesso!');
                    loadAppointments();
                } else {
                    alert('Erro ao cancelar agendamento');
                }
            } catch (error) {
                console.error('Erro ao cancelar agendamento:', error);
                alert('Erro ao cancelar agendamento');
            }
        }

        // ==================== CARREGAMENTO ====================
        async function loadAppointments() {
            try {
                const response = await fetchWithAuth('http://127.0.0.1:8001/api/appointment/');
                const appointments = await response.json();

                if (!appointments || appointments.length === 0) {
                    updateTable(renderEmptyState('Nenhum agendamento encontrado'));
                    return;
                }

                const rowsHtml = appointments.map(renderAppointmentRow).join('');
                updateTable(rowsHtml);

            } catch (error) {
                console.error('Erro ao carregar agendamentos:', error);
                updateTable(renderErrorState('Erro ao carregar agendamentos. Tente novamente.'));
            }
        }

        // Inicializar
        loadAppointments();
    </script>
</body>
</html>
